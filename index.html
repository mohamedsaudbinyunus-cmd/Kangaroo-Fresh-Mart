/* Shared by index.html and admin.html. Cloud = Firebase Realtime Database REST API. Local = this browser's storage. */
(function(){
const C=window.KFM_CONFIG||{},DB=(C.firebaseUrl||"").replace(/\/$/,""),cloud=!!DB,LS=localStorage;
const bc="BroadcastChannel"in window?new BroadcastChannel("kfm"):null;
const jget=(k,d)=>{try{const v=JSON.parse(LS.getItem(k));return v==null?d:v}catch(e){return d}};
const jset=(k,v)=>{try{LS.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
let token=sessionStorage.getItem("kfm_tok")||"";
const url=(p,auth)=>DB+"/"+p+".json"+(auth&&token?"?auth="+encodeURIComponent(token):"");
async function req(m,p,body,auth){const r=await fetch(url(p,auth),{method:m,headers:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
const list=o=>Object.keys(o||{}).map(k=>Object.assign({id:k},o[k]));
const subs=[];let last="";
const K={mode:cloud?"cloud":"local",
 cache:()=>jget("kfmx_store",{}),
 async store(){if(!cloud)return jget("kfmx_store",{});const s=(await req("GET","store"))||{};jset("kfmx_store",s);return s},
 async saveStore(s){s.updated=Date.now();if(cloud)await req("PUT","store",s,true);jset("kfmx_store",s);bc&&bc.postMessage("store")},
 onStore(f){subs.push(f)},
 start(){const fire=async()=>{try{const s=await K.store(),j=JSON.stringify(s);if(j!==last){last=j;subs.forEach(f=>f(s))}}catch(e){}};
  fire();if(cloud){setInterval(fire,8000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)fire()})}
  else{bc&&(bc.onmessage=fire);addEventListener("storage",e=>{if(e.key==="kfmx_store"||e.key==="kfmx_ph")fire()})}},
 async photo(id){if(cloud)return req("GET","photos/"+id);return jget("kfmx_ph",{})[id]||null},
 async putPhoto(id,d){if(cloud)await req("PUT","photos/"+id,d,true);else{const p=jget("kfmx_ph",{});p[id]=d;jset("kfmx_ph",p)}bc&&bc.postMessage("store")},
 async addOrder(o){o=Object.assign({status:"Pending",created:Date.now()},o);if(cloud)return req("POST","orders",o);const a=jget("kfmx_orders",[]);o.id="L"+Date.now();a.push(o);jset("kfmx_orders",a)},
 async orders(){if(cloud)return list(await req("GET","orders",undefined,true));return jget("kfmx_orders",[])},
 async setOrder(id,patch){if(cloud)return req("PATCH","orders/"+id,patch,true);const a=jget("kfmx_orders",[]),o=a.find(x=>x.id===id);if(o)Object.assign(o,patch);jset("kfmx_orders",a)},
 async addReview(r){r=Object.assign({created:Date.now()},r);if(cloud)return req("POST","reviewsPending",r);const a=jget("kfmx_revp",[]);r.id="R"+Date.now();a.push(r);jset("kfmx_revp",a)},
 async pending(){if(cloud)return list(await req("GET","reviewsPending",undefined,true));return jget("kfmx_revp",[])},
 async delPending(id){if(cloud)return req("DELETE","reviewsPending/"+id,undefined,true);jset("kfmx_revp",jget("kfmx_revp",[]).filter(x=>x.id!==id))},
 isAdmin:()=>cloud?!!token:sessionStorage.getItem("kfm_admin")==="1",
 async login(a,b){
  if(!cloud){if(!C.localPin)throw new Error("Set localPin in kfm-config.js first");if(a!==C.localPin)throw new Error("Wrong PIN");sessionStorage.setItem("kfm_admin","1");return}
  const r=await fetch((C.identityUrl||"https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword")+"?key="+encodeURIComponent(C.apiKey||"x"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:a,password:b,returnSecureToken:true})});
  const d=await r.json();if(!r.ok||!d.idToken)throw new Error("Wrong email or password");
  token=d.idToken;sessionStorage.setItem("kfm_tok",token);sessionStorage.setItem("kfm_rt",d.refreshToken||"");setTimeout(K.refresh,Math.max(60,(+d.expiresIn||3600)-120)*1000)},
 async refresh(){const rt=sessionStorage.getItem("kfm_rt");if(!rt||!cloud)return;try{const r=await fetch((C.tokenUrl||"https://securetoken.googleapis.com/v1/token")+"?key="+encodeURIComponent(C.apiKey||"x"),{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(rt)});const d=await r.json();if(d.id_token){token=d.id_token;sessionStorage.setItem("kfm_tok",token);setTimeout(K.refresh,3000*1000)}}catch(e){}},
 logout(){token="";sessionStorage.clear()}
};
window.KFM=K;
})();

</script>

{const vals=[PRODUCTS.length,CATS.length-1,PA.length,10],els=document.querySelectorAll("[data-cn]");

function renderRev(){const Rv=CONFIG.reviews||[],my=load("kfm_myrev",[]);
 const card=(x,pend)=>`<article class="rc"><div class="s" aria-label="${x.r}/5">${"★".repeat(x.r)}${"☆".repeat(5-x.r)}</div><p style="margin:6px 0 8px">${esc(x[lang]||x.en||x.bn||"")}</p><small>${esc(x.n)}${pend?" · "+t("pend"):""}</small></article>`;
 const all=my.map(x=>card(x,1)).concat(Rv.map(x=>card(x,0)));
 $("revrow").innerHTML=all.length?all.join(""):`<p class="mut">${t("norev")}</p>`;
 $("revsum").textContent=Rv.length?"★ "+(Rv.reduce((a,x)=>a+x.r,0)/Rv.length).toFixed(1)+" · "+t("revn",{n:Rv.length}):""}
function openRev(){RS=0;$("revbd").innerHTML=`<h2>${t("revW")}</h2><div class="stp" id="stp">${[1,2,3,4,5].map(i=>`<button type="button" data-star="${i}" aria-label="${i}">☆</button>`).join("")}</div><div class="f"><input id="rn" placeholder="${t("fn")}" value="${esc((U&&U.name)||"")}" autocomplete="name"><textarea id="rt" rows="4" maxlength="400" placeholder="${t("revP")}"></textarea><p class="err" id="rerr"></p><button class="btn" id="rgo">${t("revS2")}</button><button class="pill" data-close="revd">${t("close")}</button></div>`;$("revd").showModal()}
function sendRev(){const n=$("rn").value.trim(),c=$("rt").value.trim();
 if(!RS){$("rerr").textContent=t("e_star");return}if(!n||c.length<5){$("rerr").textContent=t("e_rev");return}
 save({type:"review",time:new Date().toISOString(),name:n,rating:RS,comment:c,phone:(U&&U.phone)||""});
 const my=load("kfm_myrev",[]);my.unshift({n,r:RS,en:c,bn:c});store("kfm_myrev",my.slice(0,5));
 if(!CONFIG.sheetUrl)window.open("https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent("New review ("+"★".repeat(RS)+") from "+n+":\n"+c),"_blank");
 $("revd").close();renderRev();toast(t("revok"))}

 b.innerHTML=a.map(p=>`<button type="button" class="sg" data-qv="${p.id}">${pic(p.img,p.e,nm(p))}<span><b>${esc(nm(p))}</b><small>${money(PM[p.sizes?p.id+"|m":p.id].p)} · ${unit(p)}</small></span></button>`).join("");b.hidden=!a.length});

 ["deliveryFee","freeOver","expressFee","openHour","closeHour"].forEach(k=>{if(s[k]!==undefined&&s[k]!=="")CONFIG[k]=+s[k]});
 ["whatsapp","phone","address","hours"].forEach(k=>{if(s[k])CONFIG[k]=s[k]});
 ["facebook","instagram","tiktok","youtube"].forEach(k=>{if(s[k]!==undefined)CONFIG.social[k]=s[k]});
 CONFIG.announce=s.announce||"";CONFIG.offer=st.offer||null;if(st.coupons)CONFIG.coupons=st.coupons;CONFIG.reviews=st.reviews||CONFIG.reviews||[];

 applyLang();if(typeof renderRev==="function")renderRev()}
